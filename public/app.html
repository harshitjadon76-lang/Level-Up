/* ============================================
   LEVEL UP — PREMIUM REDESIGN v3
   ============================================ */
html{scroll-behavior:smooth}

/* --- Global smoothing --- */
*{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* --- Scroll progress --- */
#scroll-bar{position:fixed;top:0;left:0;height:2px;z-index:999;background:linear-gradient(90deg,var(--ac),var(--cy),var(--ac));background-size:200% 100%;animation:gradShift 4s linear infinite;box-shadow:0 0 12px var(--ac);pointer-events:none}
@keyframes gradShift{0%{background-position:0% 0}100%{background-position:200% 0}}

/* --- Particles canvas --- */
#ptc{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.6}


/* --- Navbar glass upgrade --- */
.top{background:rgba(12,12,18,.55)!important;backdrop-filter:blur(18px) saturate(1.6)!important;-webkit-backdrop-filter:blur(18px) saturate(1.6)!important;border-bottom:1px solid rgba(184,196,255,.1)!important;transition:box-shadow .4s}
.top.scrolled{box-shadow:0 8px 32px rgba(0,0,0,.5)}
:root[data-theme=light] .top{background:rgba(255,252,244,.65)!important}
.logo{position:relative}


/* --- Tab underline morph --- */
.tab{transition:color .25s,transform .2s!important}
.tab[aria-current=page]{border-bottom-color:var(--ac)!important;text-shadow:0 0 18px rgba(184,196,255,.3)}
@media(max-width:900px){.tab[aria-current=page]{border-top-color:var(--ac)!important;border-bottom:0!important}}

/* ============ HERO — CINEMATIC ============ */
.hero{border-radius:16px!important;overflow:hidden;min-height:220px!important;border:0!important;box-shadow:0 4px 40px rgba(0,0,0,.35)}
.hero::before{animation:heroZoom 25s ease-in-out infinite alternate!important;filter:brightness(.85) saturate(1.2)}
@keyframes heroZoom{0%{transform:translate(calc(var(--mx,0)*-8px),calc(var(--my,0)*-6px)) scale(1)}100%{transform:translate(calc(var(--mx,0)*-8px),calc(var(--my,0)*-6px)) scale(1.08)}}
.hero::after{background:linear-gradient(to right,rgba(7,7,10,.85) 0%,rgba(7,7,10,.5) 40%,rgba(7,7,10,.15) 70%,rgba(7,7,10,.05) 100%),linear-gradient(to top,rgba(7,7,10,.8) 0%,transparent 50%)!important;border-radius:16px}
.hero>div{padding:24px 28px!important;position:relative;z-index:2}
.hero h1{text-shadow:none!important;background:linear-gradient(135deg,#fff 0%,#c8d4ff 50%,#8fa4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 12px rgba(184,196,255,.3))}
.hero p{color:rgba(220,215,200,.75)!important;letter-spacing:.04em}

/* hero entrance */
#app[data-anim="1"] .hero{animation:heroReveal .9s cubic-bezier(.22,1,.36,1) both!important}
@keyframes heroReveal{0%{opacity:0;transform:translateY(30px) scale(.97);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
#app[data-anim="1"] .hero h1{animation:heroTxt .8s .15s cubic-bezier(.22,1,.36,1) both!important}
@keyframes heroTxt{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}

/* accent line at bottom of hero */
.hero .hero-line{position:absolute;bottom:0;left:28px;right:28px;height:2px;background:linear-gradient(90deg,var(--ac),transparent);opacity:.5;z-index:3}

/* --- Cards — glassmorphism --- */
main .card,main .card:hover{background:rgba(16,16,22,.35)!important;backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important;border:1px solid rgba(184,196,255,.08)!important;border-radius:14px!important;padding:20px!important;transition:border-color .35s,transform .35s,box-shadow .35s!important}
main .card:hover{border-color:rgba(184,196,255,.18)!important;box-shadow:0 8px 30px rgba(0,0,0,.2)!important}
:root[data-theme=light] main .card,:root[data-theme=light] main .card:hover{background:rgba(255,252,244,.55)!important}
main .card>.card{background:none!important;border:0!important;padding:0!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-radius:0!important;box-shadow:none!important}
main .card>.card:hover{border:0!important;box-shadow:none!important}

/* staggered card entry */
#app[data-anim="1"] .card{animation:cardSlide .6s cubic-bezier(.22,1,.36,1) both!important;animation-delay:calc(var(--i,0)*60ms)!important}
@keyframes cardSlide{0%{opacity:0;transform:translateY(20px);filter:blur(3px)}100%{opacity:1;transform:none;filter:none}}

/* --- h2 headers refined --- */
h2{position:relative;border-bottom:1px solid rgba(184,196,255,.12)!important}
h2::before{content:"";width:24px;height:2px;background:var(--ac);margin-right:12px;border-radius:2px;flex:none;font-size:0!important}

/* --- Buttons refined --- */
.btn.p{border-radius:8px!important;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 75%,#fff))!important;border:0!important;box-shadow:0 2px 12px rgba(184,196,255,.25);transition:all .25s!important}
.btn.p:hover{transform:translateY(-2px)!important;box-shadow:0 6px 24px rgba(184,196,255,.35)!important;filter:brightness(1.1)!important}
.btn.p:active{transform:translateY(0)!important;box-shadow:0 1px 6px rgba(184,196,255,.2)!important}

.chip{border-radius:6px!important;transition:all .2s!important}
.chip:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}

.box{border-radius:6px!important;transition:all .3s cubic-bezier(.22,1,.36,1)!important}
.box[aria-pressed=true]{background:var(--good)!important;border-color:var(--good)!important;border-radius:50%!important;transform:scale(1);animation:checkDone .45s cubic-bezier(.22,1,.36,1)}
@keyframes checkDone{0%{transform:scale(.5) rotate(-30deg)}60%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1) rotate(0)}}

/* --- Progress bars refined --- */
.px{border-radius:8px!important;height:10px!important;background:rgba(184,196,255,.08)!important;overflow:hidden}
.px>i{border-radius:8px!important;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 60%,var(--cy)))!important;box-shadow:0 0 12px rgba(184,196,255,.3);position:relative}
.px>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%);background-size:200% 100%;animation:pxShine 2.5s ease-in-out infinite}
@keyframes pxShine{0%,100%{background-position:200% 0}50%{background-position:-100% 0}}

.sbar{border-radius:4px!important;height:8px!important;overflow:hidden}
.sbar>i{border-radius:4px!important;position:relative}
.sbar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);background-size:200% 100%;animation:pxShine 2.5s ease-in-out infinite}
#app[data-anim="1"] .px>i,#app[data-anim="1"] .sbar>i{transform-origin:left;animation:barGrow 1s .3s cubic-bezier(.22,1,.36,1) both}
@keyframes barGrow{from{transform:scaleX(0)}}

/* --- Skill ring glow --- */
.ringw{position:relative}
.ringw::before{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,rgba(184,196,255,.06),transparent 70%);animation:ringBreath 3s ease-in-out infinite}
@keyframes ringBreath{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:.8;transform:scale(1.04)}}
#app[data-anim="1"] .ring .fg{animation:ringDraw 1.2s .3s cubic-bezier(.22,1,.36,1) both}
@keyframes ringDraw{from{stroke-dasharray:0 1}}
.ringlv{transition:transform .3s}

/* --- Trophy counter --- */
.pts{text-shadow:0 0 16px rgba(184,196,255,.3)}
.pts.bumped{animation:ptsBump .5s cubic-bezier(.22,1,.36,1)}
@keyframes ptsBump{0%{transform:scale(1)}35%{transform:scale(1.25);text-shadow:0 0 28px rgba(184,196,255,.6)}100%{transform:scale(1)}}

/* --- Medal hover --- */
.frame{perspective:400px}
.frame .medal{transition:transform .5s cubic-bezier(.22,1,.36,1)!important}
.frame:hover .medal{transform:rotateY(12deg) scale(1.06)}

/* --- Items refined --- */
.item{border-radius:8px;padding:12px 8px!important;transition:all .25s!important}
.item:hover{background:rgba(184,196,255,.04)!important}
.item.pop{animation:itemPop .5s cubic-bezier(.22,1,.36,1)}
@keyframes itemPop{0%{transform:scale(.97);background:rgba(184,196,255,.15)}60%{transform:scale(1.01)}100%{transform:none;background:transparent}}

/* --- Floating number --- */
.fl{text-shadow:0 2px 16px rgba(0,0,0,.6)!important;animation:floatUp 1.2s cubic-bezier(.22,1,.36,1) forwards!important}
@keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.8);opacity:1}100%{transform:translate(-50%,-250%) scale(1.1);opacity:0}}

/* --- Leaderboard rows --- */
.pl{border-radius:8px;transition:all .25s!important}
.pl:hover{background:rgba(184,196,255,.05);transform:translateX(4px)}
.me{border-radius:8px!important;background:rgba(184,196,255,.08)!important}

/* --- Calendar cells --- */
.cd{border-radius:8px!important;transition:all .25s cubic-bezier(.22,1,.36,1)!important}
.cd:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.15)}
.cd.sel{box-shadow:0 0 0 2px var(--ac),0 4px 14px rgba(184,196,255,.2)!important}

/* --- League badges --- */
.lgi{border-radius:10px!important;transition:all .3s cubic-bezier(.22,1,.36,1)!important}
.lgi:hover{transform:translateY(-6px) scale(1.04)!important;opacity:1!important}
.lgi.on{border-radius:10px;box-shadow:0 0 0 1px var(--ac),0 4px 20px rgba(184,196,255,.15)}

/* --- Mood emoji --- */
.mood button{border-radius:10px!important;transition:all .2s!important}
.mood button:hover{transform:scale(1.2)}
.mood button[aria-pressed=true]{transform:scale(1.1);box-shadow:0 0 14px rgba(184,196,255,.25)}

/* --- Toast refined --- */
.toast{border-radius:10px!important;backdrop-filter:blur(10px)!important;box-shadow:0 8px 28px rgba(0,0,0,.35)!important;animation:toastUp .5s cubic-bezier(.22,1,.36,1)!important}
@keyframes toastUp{0%{opacity:0;transform:translate(-50%,20px) scale(.92)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}

/* --- Chat messages --- */
.mrow .msg{border-radius:16px 16px 16px 4px!important}
.mrow .msg.u{border-radius:16px 16px 4px 16px!important}

/* --- AI panel --- */
.aip{border-radius:16px!important;border:1px solid rgba(184,196,255,.2)!important;box-shadow:0 16px 48px rgba(0,0,0,.45)!important;animation:panelUp .4s cubic-bezier(.22,1,.36,1)!important;backdrop-filter:blur(20px)!important;-webkit-backdrop-filter:blur(20px)!important}
@keyframes panelUp{0%{opacity:0;transform:translateY(24px) scale(.94)}100%{opacity:1;transform:none}}

/* --- FAB avatar — rotating gradient border + glow --- */
.fab.aib{transition:all .3s cubic-bezier(.22,1,.36,1)!important;box-shadow:0 4px 20px rgba(0,0,0,.3)!important;position:relative;background:#000!important;border:0!important;padding:3px!important;overflow:visible!important}
.fab.aib::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from var(--fab-angle,0deg),var(--ac),#5fc3d4,#ff7a9c,#a97cf5,var(--ac));animation:fabSpin 3s linear infinite;z-index:-1;filter:blur(0px)}
.fab.aib::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from var(--fab-angle,0deg),var(--ac),#5fc3d4,#ff7a9c,#a97cf5,var(--ac));animation:fabSpin 3s linear infinite;z-index:-2;filter:blur(12px);opacity:.5}
@property --fab-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes fabSpin{to{--fab-angle:360deg}}
/* fallback for browsers without @property */
@supports not (background:conic-gradient(from 0deg,red,blue)){
.fab.aib::before{background:var(--ac);animation:fabPulse 2s ease-in-out infinite}
.fab.aib::after{background:var(--ac);animation:fabPulse 2s ease-in-out infinite}
}
@keyframes fabPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}
.fab.aib:hover{transform:scale(1.12)!important;box-shadow:0 6px 30px rgba(184,196,255,.4)!important}
.fab.aib:hover::after{opacity:.8;filter:blur(18px)}
.fab.aib .av{animation:avBreath 4s ease-in-out infinite}
@keyframes avBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* --- Inputs refined --- */
:root[data-theme] input,:root[data-theme] textarea{border-radius:0!important;border-bottom:2px solid rgba(184,196,255,.15)!important;transition:border-color .3s!important;padding:12px 4px!important}
:root[data-theme] input:focus,:root[data-theme] textarea:focus{border-bottom-color:var(--ac)!important}

/* --- Splash / Login screen --- */
.ctr{overflow:hidden}
.ctr.login-video::before{background:linear-gradient(90deg,rgba(5,5,8,.74),rgba(5,5,8,.38) 55%,rgba(5,5,8,.62))!important;transform:none!important}
.login-bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.login-video-audio{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:2;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.58);color:#fff;padding:9px 14px;font-size:13px;letter-spacing:.04em;white-space:nowrap}
.login-video-content{position:relative;z-index:1}
.ctr>div{position:relative;z-index:2}
.ctr::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(184,196,255,.08),transparent 65%);pointer-events:none;animation:auraPulse 5s ease-in-out infinite}
@keyframes auraPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.ctr h1{animation:titleIn 1s cubic-bezier(.22,1,.36,1) both!important}
@keyframes titleIn{0%{opacity:0;transform:translateY(40px) scale(.85);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
.ctr p{animation:subtitleIn .8s .2s both!important}
@keyframes subtitleIn{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
.ctr .btn{animation:btnIn .7s .45s both!important}
@keyframes btnIn{0%{opacity:0;transform:translateY(12px) scale(.95)}100%{opacity:1;transform:none}}

t-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(3,6,18,.78);backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px}.goal-edit-backdrop[hidden]{display:none!important}.goal-edit-modal{width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px;border:1px solid rgba(128,157,225,.3);border-radius:18px;background:#101a33;color:var(--fg,#f4f0e8);box-shadow:0 25px 80px rgba(0,0,0,.55)}.goal-edit-modal h2{margin:4px 0 16px}.goal-edit-modal label{display:grid;gap:7px;font-size:12px;font-weight:700;margin:12px 0}.goal-edit-modal input{width:100%;min-width:0;border:1px solid rgba(128,157,225,.28);border-radius:10px;background:rgba(5,12,28,.75);color:inherit;padding:11px}.goal-edit-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.custom-goal-row{grid-template-columns:minmax(0,2fr) minmax(90px,.8fr) minmax(110px,1fr) minmax(130px,1fr) auto}.custom-goal-row button{white-space:nowrap}

/* ===== Level Up: motion & depth pass ===== */
.mote{position:fixed;left:0;top:0;z-index:260;pointer-events:none;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--mc,#6fd3a0);box-shadow:0 0 10px 2px var(--mc,#6fd3a0);will-change:transform,opacity}
.tab.rank-hit{animation:rankHit .75s cubic-bezier(.2,1.2,.4,1)}
@keyframes rankHit{0%{transform:none}28%{transform:translateY(-3px) scale(1.16);color:var(--fg);text-shadow:0 0 18px var(--ac),0 0 4px var(--ac)}100%{transform:none}}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
main .card.lit:hover{background:radial-gradient(360px circle at var(--sx,50%) var(--sy,50%),color-mix(in srgb,var(--ac) 12%,transparent),transparent 65%),rgba(16,16,22,.35)!important}
:root[data-theme=light] main .card.lit:hover{background:radial-gradient(360px circle at var(--sx,50%) var(--sy,50%),color-mix(in srgb,var(--ac) 14%,transparent),transparent 65%),rgba(255,252,244,.55)!important}
.rank-emblem-frame{transform:perspective(520px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
}

/* ===== Rank-up / rank-down: no box, fits the screen, stronger entrance ===== */
#ov.rank-celebration>div.rank-celebration__panel{width:min(640px,100%);max-height:none;overflow:visible;padding:0;border:0;border-radius:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;animation:none;gap:clamp(6px,1.6vh,16px)}
#ov.rank-celebration h1{font-size:clamp(44px,min(12vw,13vh),104px);animation:rankRise .6s .05s cubic-bezier(.22,1,.36,1) backwards,rankTitleGlow 2.4s .65s ease-in-out infinite alternate}
.rank-emblem-stage{width:clamp(120px,min(34vw,27vh),220px);height:clamp(120px,min(34vw,27vh),220px)}
#ov.rank-celebration .rank-emblem-shell .medal{animation:rankSlam 1.1s cubic-bezier(.2,.9,.25,1) both}
.rank-emblem-stage::after{content:"";position:absolute;left:50%;top:50%;width:100%;height:100%;border-radius:50%;border:6px solid rgba(255,226,154,.95);pointer-events:none;z-index:1;opacity:0;transform:translate(-50%,-50%) scale(.4);animation:rankShock 1s .46s cubic-bezier(.1,.7,.2,1) both}
#ov.rank-celebration .rank-celebration__eyebrow{animation:rankRise .5s backwards;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#ov.rank-celebration .rank-transition{animation:rankRise .6s .85s cubic-bezier(.22,1,.36,1) backwards}
#ov.rank-celebration .rank-trophy-total{animation:rankRise .6s 1s cubic-bezier(.22,1,.36,1) backwards}
#ov.rank-celebration .rank-celebration__message{animation:rankRise .6s 1.1s cubic-bezier(.22,1,.36,1) backwards;text-shadow:0 2px 12px rgba(0,0,0,.9)}
#ov.rank-celebration .rank-claim{animation:rankRise .6s 1.25s cubic-bezier(.22,1,.36,1) backwards,rankClaimShimmer 3.4s linear infinite}
@keyframes rankRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes rankSlam{0%{opacity:0;transform:scale(2.6) rotate(-18deg);filter:blur(14px) brightness(2.2)}45%{opacity:1;transform:scale(.88) rotate(4deg);filter:blur(0) brightness(1.7)}62%{transform:scale(1.14) rotate(-2deg);filter:brightness(1.25)}80%{transform:scale(.97) rotate(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes rankShock{0%{opacity:.95;transform:translate(-50%,-50%) scale(.4);border-width:6px}100%{opacity:0;transform:translate(-50%,-50%) scale(3.2);border-width:1px}}
@media(prefers-reduced-motion:reduce){#ov.rank-celebration h1,#ov.rank-celebration .rank-celebration__eyebrow,#ov.rank-celebration .rank-transition,#ov.rank-celebration .rank-trophy-total,#ov.rank-celebration .rank-celebration__message,#ov.rank-celebration .rank-claim,#ov.rank-celebration .rank-emblem-shell .medal{animation:none!important}.rank-emblem-stage::after{display:none!important}}

/* ===== Goals page: match the site theme (dark panels, square corners, Bebas headings, lavender accent) ===== */

<script>
/* Keep mobile navigation outside the header so fixed positioning is relative to the viewport. */
(function () {
  function placePrimaryNavigation() {
    var nav = document.querySelector('nav.tabs');
    if (!nav) return;
    var header = document.querySelector('header.top');
    if (window.matchMedia('(max-width: 1024px)').matches) {
      if (nav.parentElement !== document.body) document.body.appendChild(nav);
      nav.classList.add('mobile-bottom-nav');
    } else {
      nav.classList.remove('mobile-bottom-nav');
      if (header && nav.parentElement !== header) {
        var profile = header.querySelector('.tr');
        header.insertBefore(nav, profile || null);
      }
    }
  }
  placePrimaryNavigation();
  window.addEventListener('resize', placePrimaryNavigation, { passive: true });
  new MutationObserver(placePrimaryNavigation).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
